name: Install smoke test

# Installs the published package into a fresh app on the latest stable
# Flutter, so a Flutter release that breaks locale_sweep is caught early.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'locale_sweep version to install (empty for latest)'
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter --version

      - name: Install from pub.dev and run a sweep
        env:
          VERSION: ${{ inputs.version }}
        run: tool/install_smoke_test.sh "$VERSION"
